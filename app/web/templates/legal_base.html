<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index,follow">
    <meta name="description" content="{% block meta_description %}Mentor Connect — платформа для обучения, развития и поддержки команд.{% endblock %}">
    <title>{% block title %}Mentor Connect{% endblock %}</title>
    <link rel="canonical" href="{% block canonical_url %}https://mentorconnect.kz/{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:site_name" content="Mentor Connect">
    <meta property="og:title" content="{% block social_title %}Mentor Connect{% endblock %}">
    <meta property="og:description" content="{% block social_description %}Mentor Connect — платформа для обучения, развития и поддержки команд.{% endblock %}">
    <meta property="og:url" content="{% block social_url %}https://mentorconnect.kz/{% endblock %}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{% block twitter_title %}Mentor Connect{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Mentor Connect — платформа для обучения, развития и поддержки команд.{% endblock %}">
    <link rel="stylesheet" href="/static/css/app.css?v=20261004-1">
</head>
<body class="legal-body">
    <header class="legal-header">
        <a class="landing-brand" href="/" aria-label="Mentor Connect — главная">
            <span class="landing-brand-mark" aria-hidden="true">M</span>
            <span>Mentor Connect</span>
        </a>
        <a class="legal-back-link" href="/">На главную</a>
    </header>
    <main class="legal-shell">
        <article class="legal-document">
            {% block content %}{% endblock %}
        </article>
    </main>
</body>
</html>
