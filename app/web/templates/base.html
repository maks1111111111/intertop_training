<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Intertop Training{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar" aria-label="Основная навигация">
            <div class="brand">
                <a href="/courses" class="brand-link">Intertop Training</a>
            </div>
            <nav class="sidebar-nav">
                <a href="/courses" class="nav-link{% if active_nav == 'courses' %} is-active{% endif %}">
                    Курсы
                </a>
                <a href="/dashboard" class="nav-link{% if active_nav == 'dashboard' %} is-active{% endif %}">
                    Моё обучение
                </a>
            </nav>
        </aside>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
